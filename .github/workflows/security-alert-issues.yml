name: Create Issue on Security Alert

on:
  dependabot_alert:
    types: [created]

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create Issue
        uses: actions/github-script@v7
        with:
          script: |
            const alert = context.payload.alert;
            const title = `Security Alert: ${alert.security_vulnerability.package.name} (${alert.security_vulnerability.severity})`;
            const body = `
            # Security Alert Detected
            
            **Package:** ${alert.security_vulnerability.package.name}
            **Severity:** ${alert.security_vulnerability.severity}
            **Ecosystem:** ${alert.security_vulnerability.package.ecosystem}
            
            ## Description
            ${alert.security_advisory.description}
            
            [View Alert Details](${alert.html_url})
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'dependabot']
            });
