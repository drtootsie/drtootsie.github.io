name: Create Issue on Security Alert

on:
  repository_vulnerability_alert:
    types: [create]

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create Issue
        uses: actions/github-script@v7
        with:
          script: |
            const alert = context.payload.alert;
            const packageName = alert.affected_package_name;
            const severity = alert.severity;
            const ghsaId = alert.ghsa_id;
            const alertUrl = alert.external_reference || `https://github.com/${context.repo.owner}/${context.repo.repo}/network/alert/${alert.number}`;

            const title = `Security Alert: ${packageName} (${severity})`;
            const body = `
            # Security Alert Detected
            
            **Package:** ${packageName}
            **Severity:** ${severity}
            **GHSA ID:** ${ghsaId}
            
            ## Description
            A new security vulnerability has been detected in your dependencies.
            
            [View Alert Details](${alertUrl})
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'dependabot']
            });
