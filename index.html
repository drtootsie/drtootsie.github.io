<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dad's Ebook Scout — Mystery • Sci-Fi • Time Travel • Crime</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-green: #22c55e;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.25rem;
      max-width: 900px;
      margin-inline: auto;
    }
    header {
      border-bottom: 1px solid #334155;
      padding-bottom: 1rem;
      margin-bottom: 1.25rem;
    }
    h1 { margin: 0 0 0.4rem 0; font-size: 1.5rem; }
    p.sub { margin: 0; color: var(--muted); font-size: 0.95rem; }
    .filters {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin: 1rem 0;
    }
    button.chip {
      background: var(--card);
      color: var(--text);
      border: 1px solid #334155;
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button.chip.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.5rem;
    }
    .badge {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #0f172a;
      color: var(--accent);
      padding: 0.2rem 0.5rem;
      border-radius: 0.35rem;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-top: 0.9rem;
    }
    .btn {
      text-decoration: none;
      text-align: center;
      padding: 0.55rem 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .btn-epub { background: var(--accent-green); color: #052e16; }
    .btn-libby { background: var(--accent); color: #082f49; }
    .btn-amz { background: #334155; color: var(--text); }
  </style>
</head>
<body>
  <header>
    <h1>📚 Dad's Ebook Scout</h1>
    <p class="sub">Curated Crossover Discovery: Mystery • Sci-Fi • Time Travel • Crime Noir</p>
    <div class="filters">
      <button class="chip active" onclick="filterBooks('all', this)">All Genres</button>
      <button class="chip" onclick="filterBooks('time-travel', this)">⏱️ Time Travel</button>
      <button class="chip" onclick="filterBooks('sci-fi', this)">🚀 Sci-Fi</button>
      <button class="chip" onclick="filterBooks('mystery', this)">🕵️ Mystery</button>
      <button class="chip" onclick="filterBooks('crime', this)">🚓 Crime Noir</button>
    </div>
  </header>
  <div id="grid" class="grid"></div>
  <script>
    let catalog = [];
    async function init() {
      const res = await fetch('./dad_curated_catalog.json');
      const data = await res.json();
      catalog = data.curated_crossover_picks;
      render('all');
    }
    function filterBooks(genre, btn) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      render(genre);
    }
    function render(genre) {
      const grid = document.getElementById('grid');
      const items = genre === 'all' ? catalog : catalog.filter(b => b.genres.includes(genre));
      grid.innerHTML = items.map(b => {
        const q = encodeURIComponent(b.title + ' ' + b.author);
        const libby = `https://mcpl.overdrive.com/search?query=${q}`;
        const amz = b.asin ? `https://www.amazon.com/dp/${b.asin}` : `https://www.amazon.com/s?k=${q}`;
        return `
          <div class="card">
            <div>
              <div class="badges">${b.genres.map(g => `<span class="badge">${g}</span>`).join('')}</div>
              <h3 style="margin:0.2rem 0">${b.title}</h3>
              <div style="color:#94a3b8;font-size:0.85rem;margin-bottom:0.6rem">${b.author}</div>
              <p style="font-size:0.88rem;line-height:1.4;color:#cbd5e1;margin:0">${b.hook}</p>
            </div>
            <div class="actions">
              ${b.epub_url ? `<a class="btn btn-epub" href="${b.epub_url}">⬇️ Direct DRM-Free EPUB</a>` : ''}
              <a class="btn btn-libby" href="${libby}" target="_blank">🏛️ Borrow Free on Libby (MCPL)</a>
              <a class="btn btn-amz" href="${amz}" target="_blank">📦 View on Amazon Kindle</a>
            </div>
          </div>
        `;
      }).join('');
    }
    init();
  </script>
</body>
</html>
